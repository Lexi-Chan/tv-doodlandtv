<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Doodland TV">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#326da4">
  <link rel="apple-touch-icon" href="app-icon.png" id="apple-touch-icon">
  <link rel="icon" type="image/png" href="app-icon.png" id="favicon-icon">
  <link rel="stylesheet" href="style.css">
  <title>Doodland TV</title>
</head>
<body>
  <div class="app-shell">
    <header class="navigation-bar">
      <div class="navigation-left"><img src="app-icon.png" alt="Doodland TV"></div>
      <h1>Doodland TV</h1>
      <div class="navigation-right"><span class="live-button"><i></i>LIVE</span></div>
    </header>
    <div class="appearance-picker" id="appearance-picker" aria-label="Appearance mode">
      <span class="appearance-label">Appearance</span>
      <button type="button" class="appearance-choice" data-theme="light" id="theme-light">Light</button>
      <button type="button" class="appearance-choice" data-theme="dark" id="theme-dark">Dark</button>
    </div>
    <main class="content">
      <section class="watch-column" aria-label="Live TV">
        <div class="section-heading">NOW PLAYING</div>
        <div class="tv-frame">
          <div class="tv-ratio">
            <video id="live-video" src="https://eeeeeeee.taild40b43.ts.net/iptv/channel/1.ts" controls="controls" width="640" height="360" preload="none" x-webkit-airplay="allow" aria-label="Doodland TV live stream">
              This browser cannot display the video element. <a href="https://eeeeeeee.taild40b43.ts.net/iptv/channel/1.ts">Open the live stream directly</a>.
            </video>
          </div>
        </div>
        <p class="channel-note">Tap the play button to watch live. Playback is started by you, not automatically. If playback fails, <a href="https://eeeeeeee.taild40b43.ts.net/iptv/channel/1.ts">open the stream directly</a> to test direct stream support.</p>
      </section>
      <aside class="channel-column" aria-label="Current channel">
        <div class="section-heading">CHANNEL</div>
        <div class="grouped-list">
          <div class="channel-row">
            <img class="channel-icon" src="app-icon.png" alt="">
            <div class="channel-copy">
              <div class="channel-title">Doodland TV</div>
              <div class="channel-subtitle"><span class="on-air-dot"></span> Channel 1 · On Air</div>
            </div>
            <span class="disclosure" aria-hidden="true"></span>
          </div>
          <div class="detail-row"><span>NOW ON</span><strong id="program-title">Loading schedule...</strong></div>
          <div class="detail-row"><span>PLAYER</span><strong id="player-status">Ready</strong></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
